worker_processes 1;

# 로그와 PID 파일을 표준 시스템 경로(root 권한 필요)로 변경하여 권한 문제 해결
error_log /var/log/nginx/paylink_error.log;
pid       /var/run/paylink_nginx.pid;

events {
    worker_connections 1024;
}

http {
    # 임시 경로는 기본값 사용 (시스템 기본 설정 따름)
    # client_body_temp_path 등은 주석 처리하여 기본값 사용
    # 필요한 경우 /var/lib/nginx/tmp 등을 사용할 수 있음

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    access_log      /var/log/nginx/paylink_access.log;
    sendfile        on;
    keepalive_timeout  65;

    # Reverse Proxy Configuration for PayLink
    server {
        # Listening on port 80 (Standard HTTP)
        # 7861 포트는 Gradio 앱이 사용 중이므로 충돌 방지를 위해 Nginx는 80 포트를 사용합니다.
        listen 80;
        
        # Replace 'your-domain.com' with your actual domain
        server_name kakaopaylink.kro.kr; # 도메인을 여기에 입력하세요

        location / {
            # Proxying to Gradio App running on port 7861
            proxy_pass http://127.0.0.1:7861;
            
            # Setup headers for WebSocket (needed for Gradio)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
