<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayLink - 스마트 요금제 상담</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .message-enter {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 0.3s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes typing {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body class="bg-slate-50 h-screen flex flex-col items-center justify-center p-4">

    <!-- 채팅 컨테이너 -->
    <div
        class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col h-[80vh] md:h-[600px] border border-slate-100">

        <!-- 헤더 -->
        <div class="bg-indigo-600 p-4 text-white flex items-center shadow-md z-10">
            <div
                class="w-10 h-10 bg-indigo-500 rounded-full flex items-center justify-center mr-3 border border-indigo-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                </svg>
            </div>
            <div>
                <h1 class="font-bold text-lg">PayLink AI 상담사</h1>
                <p class="text-xs text-indigo-100 opacity-90">최적의 요금제를 찾아드려요</p>
            </div>
        </div>

        <!-- 채팅 영역 -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50 scrollbar-hide">
            <!-- 초기 메시지 -->
            <div class="flex items-start message-enter">
                <div
                    class="flex-shrink-0 w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center mr-2 text-indigo-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                </div>
                <div class="bg-white p-3 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 max-w-[85%]">
                    <p class="text-slate-700 text-sm leading-relaxed">
                        안녕하세요! <span class="text-indigo-600 font-bold">PayLink</span>입니다 😊<br>
                        원하시는 요금제 조건을 말씀해 주시면 딱 맞는 상품을 찾아드릴게요!<br><br>
                        <span class="text-slate-400 text-xs">예시: "2만원대 데이터 무제한", "알뜰폰 싼 거 추천해줘"</span>
                    </p>
                </div>
            </div>
        </div>

        <!-- 로딩 인디케이터 (숨김) -->
        <div id="loading" class="hidden px-4 py-2">
            <div class="flex items-center space-x-1 pl-10">
                <div class="w-2 h-2 bg-indigo-400 rounded-full typing-dot"></div>
                <div class="w-2 h-2 bg-indigo-400 rounded-full typing-dot"></div>
                <div class="w-2 h-2 bg-indigo-400 rounded-full typing-dot"></div>
            </div>
        </div>

        <!-- 입력 영역 -->
        <div class="p-4 bg-white border-t border-slate-100">
            <div
                class="flex items-center bg-slate-50 rounded-full px-4 py-2 border border-slate-200 focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-100 transition-all">
                <input type="text" id="user-input"
                    class="flex-1 bg-transparent border-none outline-none text-sm placeholder-slate-400 text-slate-700"
                    placeholder="원하는 조건을 입력하세요..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()"
                    class="ml-2 p-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full transition-colors flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <p class="mt-4 text-xs text-slate-400">Powered by PayLink AI</p>

    <script>
        const chatContainer = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const loading = document.getElementById('loading');

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessage(sender, content, type = 'text') {
            const div = document.createElement('div');
            div.className = `flex items-start message-enter ${sender === 'user' ? 'justify-end' : ''}`;

            if (sender === 'bot') {
                let htmlContent = '';
                if (type === 'plan') {
                    // 요금제 카드 렌더링
                    htmlContent = `
                        <div class="w-full space-y-3 mt-1">
                            ${content.map((plan, i) => {
                        // 혜택 텍스트 정제
                        let benefits = plan.benefits || '없음';
                        if (benefits === 'nan') benefits = '없음';

                        // 2년 평균 비용 계산 표시
                        let avgFeeDisplay = '';
                        if (plan.is_discounted && plan.real_avg_fee) {
                            avgFeeDisplay = `<div class="text-[11px] text-indigo-600 bg-indigo-50 p-2 rounded-lg flex justify-between items-center border border-indigo-100 mt-2">
                                      <span class="font-medium">💡 2년 평균 월 납부액</span>
                                      <span class="font-bold">${plan.real_avg_fee.toLocaleString()}원</span>
                                  </div>`;
                        } else if (!plan.is_discounted) {
                            avgFeeDisplay = `<div class="text-[11px] text-slate-500 bg-slate-50 p-2 rounded-lg flex justify-between items-center border border-slate-100 mt-2">
                                      <span class="font-medium">✅ 평생 요금 변동 없음</span>
                                  </div>`;
                        }

                        // 평점 별 표시
                        let stars = '';
                        const rating = plan.rating || 0;
                        const fullStars = Math.floor(rating);
                        const hasHalf = rating % 1 >= 0.5;

                        for (let s = 0; s < 5; s++) {
                            if (s < fullStars) stars += '<span class="text-yellow-400">★</span>';
                            else if (s === fullStars && hasHalf) stars += '<span class="text-yellow-400">★</span>'; // 반별 구현 대신 일단 꽉찬별로 근사 처리가능하나 여기선 그냥 꽉찬별로 처리
                            else stars += '<span class="text-slate-200">★</span>';
                        }
                        // 정확한 별점 텍스트
                        const ratingText = rating > 0 ? `<span class="text-[10px] text-slate-400 ml-1">(${rating})</span>` : '';


                        return `
                                <div onclick="this.querySelector('.expand-icon').classList.toggle('rotate-180'); this.querySelector('.benefit-details').classList.toggle('hidden');" class="group cursor-pointer bg-white p-4 rounded-xl shadow-sm border border-indigo-50 hover:border-indigo-200 transition-all hover:shadow-md relative overflow-hidden">
                                    <div class="flex justify-between items-start mb-2">
                                        <span class="bg-indigo-50 text-indigo-700 text-[10px] font-bold px-2 py-1 rounded-md uppercase tracking-wide border border-indigo-100">${plan.carrier}</span>
                                        <div class="text-right">
                                            <span class="text-lg font-bold text-slate-800 block leading-tight">${plan.monthly_fee.toLocaleString()}원</span>
                                            ${plan.is_discounted ? `<span class="text-[10px] text-rose-500 font-medium">✨ 할인 적용가</span>` : '<span class="text-[10px] text-slate-400">정상가</span>'}
                                            <div class="text-xs mt-1 flex justify-end items-center">${stars}${ratingText}</div>
                                        </div>
                                    </div>
                                    <h3 class="font-medium text-slate-700 text-sm mb-3 line-clamp-1 border-b border-slate-50 pb-2 flex items-center justify-between">
                                        ${plan.plan_name}
                                        <svg xmlns="http://www.w3.org/2000/svg" class="expand-icon h-4 w-4 text-slate-400 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                        </svg>
                                    </h3>
                                    
                                    <div class="grid grid-cols-3 gap-2 mb-2">
                                        <div class="bg-slate-50 p-2 rounded-lg text-center">
                                            <div class="text-[10px] text-slate-400 mb-1">데이터</div>
                                            <div class="text-xs font-bold text-slate-700">${plan.data_gb >= 100 ? '무제한' : plan.data_gb + 'GB'}</div>
                                        </div>
                                        <div class="bg-slate-50 p-2 rounded-lg text-center">
                                            <div class="text-[10px] text-slate-400 mb-1">통화</div>
                                            <div class="text-xs font-bold text-slate-700">${plan.voice_min >= 999 ? '기본제공' : plan.voice_min + '분'}</div>
                                        </div>
                                        <div class="bg-slate-50 p-2 rounded-lg text-center">
                                            <div class="text-[10px] text-slate-400 mb-1">문자</div>
                                            <div class="text-xs font-bold text-slate-700">${plan.sms_count >= 999 ? '기본제공' : plan.sms_count + '건'}</div>
                                        </div>
                                    </div>

                                    ${avgFeeDisplay}

                                    <div class="benefit-details hidden mt-3 pt-3 border-t border-slate-100 transition-all">
                                        <div class="text-[11px] text-slate-500">
                                            <span class="font-bold text-slate-700 block mb-1">상세 혜택</span>
                                            <span class="leading-relaxed whitespace-pre-wrap">${benefits}</span>
                                        </div>
                                    </div>
                                    <div class="benefit-details text-[10px] text-center text-slate-300 mt-2 block">
                                        클릭하여 상세 혜택 보기
                                    </div>
                                </div>
                            `}).join('')}
                        </div>
                    `;
                } else {
                    htmlContent = `
                        <div class="bg-white p-3 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 max-w-[85%]">
                            <p class="text-slate-700 text-sm leading-relaxed whitespace-pre-wrap">${content}</p>
                        </div>
                    `;
                }

                div.innerHTML = `
                    <div class="flex-shrink-0 w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center mr-2 text-indigo-600 mt-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                    </div>
                    ${htmlContent}
                `;
            } else {
                div.innerHTML = `
                    <div class="bg-indigo-600 p-3 rounded-2xl rounded-tr-none shadow-md max-w-[85%]">
                        <p class="text-white text-sm leading-relaxed">${content}</p>
                    </div>
                `;
            }

            chatContainer.appendChild(div);
            scrollToBottom();
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // 사용자 메시지 표시
            appendMessage('user', message);
            userInput.value = '';

            // 로딩 표시
            loading.classList.remove('hidden');
            scrollToBottom();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                // 로딩 숨기기
                loading.classList.add('hidden');

                if (data.success && data.messages) {
                    data.messages.forEach(msg => {
                        if (msg.type === 'plan') {
                            appendMessage('bot', msg.plans, 'plan');
                        } else {
                            appendMessage('bot', msg.content);
                        }
                    });
                } else {
                    appendMessage('bot', '죄송해요, 오류가 발생했어요. 다시 시도해 주세요. 😥');
                }
            } catch (error) {
                loading.classList.add('hidden');
                console.error('Error:', error);
                appendMessage('bot', '서버와 연결할 수 없어요. 잠시 후 다시 시도해 주세요.');
            }
        }
    </script>
</body>

</html>
